<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmap Completo — Engenharia da Computação</title>
  <meta name="description" content="Roadmap completo de Engenharia da Computação: do iniciante ao avançado. 2056 itens e 87 projetos práticos. IA, ML, Full-Stack, DevOps, Segurança, Robótica e mais.">
  <meta property="og:title" content="Roadmap Completo — Engenharia da Computação">
  <meta property="og:description" content="Do zero ao avançado: 92 áreas, 2056 itens e 87 projetos práticos.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236ea8fe'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'%3E🧭%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#content" class="skip-link">Pular para o conteúdo</a>

  <div class="app">
    <!-- ══════════ SIDEBAR ══════════ -->
    <aside class="sidebar" id="sidebar" aria-label="Navegação">
      <div class="brand"><span class="logo" aria-hidden="true">🧭</span> Roadmap</div>

      <!-- Progresso (preenchido na Fase 2/4) -->
      <div class="prog">
        <div class="ring" id="prog-ring" data-pct="0%" style="--p:0" role="img" aria-label="Progresso geral: 0%"></div>
        <div class="prog-info">
          <b id="prog-headline">0% completo</b>
          <span id="prog-sub">— de 2056 itens</span>
        </div>
      </div>

      <!-- Ferramentas (ocupa o topo, no lugar dos antigos Níveis) -->
      <div>
        <div class="nav-label">Ferramentas</div>
        <div id="tools">
          <button class="nav-item" id="tool-study">📚 Estudo do Dia</button>
          <button class="nav-item" id="review-widget" style="display:none" title="Itens prontos para revisar">🔁 Revisar <span class="tool-count review-count">0</span></button>
          <button class="nav-item" id="tool-pace">📅 Planejar ritmo</button>
          <button class="nav-item" id="tool-collapse">🔼 Recolher tudo</button>
          <button class="nav-item" id="tool-export">📥 Exportar</button>
          <button class="nav-item" id="tool-import">📤 Importar</button>
          <button class="nav-item tool-danger" id="tool-reset">🗑️ Resetar</button>
        </div>
      </div>

      <!-- Trilhas (filtros) -->
      <div>
        <div class="nav-label">Trilhas</div>
        <div class="chips" id="track-chips" role="group" aria-label="Filtrar por trilha">
          <button class="chip on" data-track="all">Todas</button>
          <button class="chip" data-track="gamedesign">🎮 Game Design</button>
          <button class="chip" data-track="ai">🤖 IA &amp; ML</button>
          <button class="chip" data-track="web">🌐 Web</button>
          <button class="chip" data-track="security">🔒 Segurança</button>
          <button class="chip" data-track="hardware">🔧 Hardware</button>
          <button class="chip" data-track="data">📊 Dados</button>
        </div>
      </div>
    </aside>

    <!-- ══════════ MAIN ══════════ -->
    <div class="main">
      <header class="topbar">
        <button class="hamburger" id="nav-toggle" aria-label="Abrir menu de navegação" aria-controls="sidebar" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="search">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input type="text" id="search" aria-label="Buscar tópicos, itens, livros ou termos" placeholder="Buscar qualquer tópico, item, livro ou termo…" autocomplete="off">
        </div>
        <div class="seg" role="group" aria-label="Filtrar itens">
          <button class="filter-btn on" data-filter="all" aria-pressed="true">Todos</button>
          <button class="filter-btn" data-filter="not-studied" aria-pressed="false">⬜ Não estudados</button>
          <button class="filter-btn" data-filter="studied" aria-pressed="false">✅ Estudados</button>
        </div>
      </header>

      <main class="content" id="content">
        <div id="sr-live" class="sr-live" role="status" aria-live="polite"></div>
        <div id="search-results" class="search-results" role="region" aria-label="Resultados da busca" style="display:none"></div>

        <!-- Conteúdo renderizado na Fase 2 -->
        <div id="roadmap"></div>

        <!-- Estado de carregamento (removido quando o render entra) -->
        <div class="loading" id="shell-placeholder" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <p>Carregando roadmap…</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Scrim da sidebar mobile (overlay slide-in em ≤820px) -->
  <div class="scrim" id="nav-scrim"></div>

  <!-- ══════════ DRAWER (vazio — wiring de diálogo na Fase 3) ══════════ -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detalhes" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <div class="path" id="drawer-path"></div>
        <h2 id="drawer-title"></h2>
      </div>
      <button class="x" id="drawer-close" aria-label="Fechar painel">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Voltar ao topo" aria-label="Voltar ao topo">↑</button>

  <!-- Dados + app (render religado na Fase 2) -->
  <script defer src="data.js"></script>
  <script defer src="projects.js"></script>
  <script defer src="final.js"></script>
  <script defer src="app.js"></script>
  <script>
    if('serviceWorker' in navigator && location.protocol.startsWith('http')){
      window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
    }
  </script>
</body>
</html>
